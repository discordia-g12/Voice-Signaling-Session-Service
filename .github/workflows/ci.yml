name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Igual que Chat y Notification: se ve en el log pero no bloquea. Hoy reporta Fastify 4, que solo se
      # corrige pasando a Fastify 5 (cambio mayor, en un PR aparte). Alcanza con el package-lock.json.
      - name: Dependency audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Run Lint, Typecheck and Tests inside Docker
        run: |
          docker compose run --rm voice_signaling_svc sh -c "\
            npm run lint && \
            npm run typecheck && \
            npm run test \
          "

  docker:
    # PR: construye la imagen para validar el Dockerfile. Push a main/develop: además la publica en GHCR
    # con el SHA del commit (lo que se despliega) y el nombre de la rama. Sin "latest".
    runs-on: ubuntu-latest
    needs: test-and-build
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/discordia-g12/voice-signaling-service
      PUSH: ${{ github.event_name == 'push' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # evita el límite de descargas anónimas de Docker Hub (imágenes base)
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch

      - name: Build (and push on main/develop)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Solo en push a main, con la imagen ya en GHCR: el workflow del orquestador la despliega en el nodo realtime
  # por SSM y falla si no queda healthy (en ese caso el nodo vuelve solo al tag anterior).
  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    uses: discordia-g12/discordia-orchestrator/.github/workflows/deploy.yml@main
    with:
      service: voice-signaling-service
      node: realtime
      sha: ${{ github.sha }}
