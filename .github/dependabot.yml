# Actualizaciones de dependencias con un PR a develop, que pasa por el CI como cualquier cambio.
# Mensual y con pocos PRs abiertos a la vez, para no gastar los minutos de Actions: cada PR (y cada rebase)
# corre el CI completo. Las minor y patch de cada ecosistema llegan juntas en un solo PR; las major de a una,
# porque pueden romper y hay que revisarlas (salvo las de github-actions, que van todas juntas).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Todas las versiones en un solo PR, también las major: cambiar de versión una action rara vez rompe algo
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]
