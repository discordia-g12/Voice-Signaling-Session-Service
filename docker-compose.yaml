services:
  voice_signaling_svc:
    build: .
    container_name: discordia_voice_signaling
    ports:
      - "8082:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - REDIS_HOST=redis_voice
      - REDIS_PORT=6379
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_PUBLIC_URL=ws://localhost:7880
      # Permisos: Server-Roles-Core corriendo en el host (su docker compose publica el 8080)
      - CORE_SERVICE_URL=${CORE_SERVICE_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis_voice:
        condition: service_healthy
      livekit:
        condition: service_started

  redis_voice:
    image: redis:7-alpine
    container_name: discordia_voice_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 3
      start_period: 2s

  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: discordia_voice_livekit
    command: --dev --bind 0.0.0.0
    environment:
      - |
        LIVEKIT_CONFIG=webhook:
          api_key: devkey
          urls:
            - http://host.docker.internal:8082/webhooks/livekit
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
