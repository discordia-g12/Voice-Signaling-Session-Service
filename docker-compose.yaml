services:
  voice_signaling_svc:
    build: .
    container_name: discordia_voice_signaling
    ports:
      - "8082:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - REDIS_HOST=redis_voice
      - REDIS_PORT=6379
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_PUBLIC_URL=ws://localhost:7880
    depends_on:
      redis_voice:
        condition: service_healthy
      livekit:
        condition: service_started

  redis_voice:
    image: redis:7-alpine
    container_name: discordia_voice_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 3
      start_period: 2s

  livekit:
    image: livekit/livekit-server:latest
    container_name: discordia_voice_livekit
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
